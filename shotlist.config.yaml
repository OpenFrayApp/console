# yaml-language-server: $schema=node_modules/shotlist/dist/schema.json
#
# The handbook's and the site's screenshots. Run the console first — `npm run dev` — then
# `npx shotlist` to list the recipes, or `npx shotlist <name> --install` to re-shoot one.
#
# STYLE.md governs what a capture may show: the app's default dark theme, at 2×, red
# annotation, and sample data only — never a real name.

site:
  url: http://localhost:5199/console/
  viewport: { width: 1440, height: 900 }
  scale: 2
  theme: dark
  # The console renders before the compendium arrives, so a selector alone is not enough
  # to know the board is ready to shoot.
  ready: 'text=Add creature'
  settle: 800

style:
  color: '#E5484A' # the red STYLE.md specifies
  canvas: '#020617' # the console's own background, so a margin is invisible
  label:
    # The console's own stack, so a callout is set in the same face as the interface it
    # points at. The generic entries always resolve, so this never falls back silently on
    # a machine without the named ones.
    font: "ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
    weight: 700
    fill: '#FFFFFF'
    stroke: '#E5484A'
    # SVG centres a stroke on the glyph outline, so half of it is hidden under the fill.
    # Twelve here is the six the previous captures show outside each letter.
    strokeWidth: 12
  number:
    fill: '#E5484A'
    text: '#FFFFFF'

paths:
  recipes: screenshots/recipes
  macros: screenshots/macros
  data: screenshots/data
  out: screenshots/out

install:
  docs: docs/src/assets/screens
  site: site/src/assets/screenshots

finders:
  # The modal card owning a heading. The overlay behind it fills the viewport, so the
  # climb has to pass through every narrow ancestor to the outermost one — stopping at
  # the first would frame the heading, not the card.
  panel:
    heading: $1
    ancestor: { narrowerThan: 95vw, pick: outermost }

  # A tracker row: the smallest box holding both a combatant's name and an AC. The
  # console renders no test hooks here, so the shape is what identifies it.
  trackerRow:
    css: 'li, div'
    contains: $1
    matching: 'AC\s*\d'
    maxChildren: 12
    pick: smallest

  # A dialog that carries a given control, for the ones whose heading is not unique.
  dialogWith:
    css: div
    contains: $1
    minWidth: 400
    maxWidth: 90vw
    minHeight: 300
    pick: smallest
