# yaml-language-server: $schema=../../node_modules/shotlist/dist/recipe.schema.json
#
# The compendium open on a creature, for the site's libraries section.
#
# Shot portrait rather than at the console's usual landscape: it sits in a column beside
# three cards, and a 16:9 crop there is a third of their height with a hole under it.
# Taller keeps both the list and the stat block readable at that width.
name: compendium-hero
install: site
viewport: { width: 1280, height: 1500 }

setup:
  # The checkbox is ticked rather than its label: a first-party library's name inside that
  # label is a link to the book, so clicking the writing navigates away.
  - use: open-settings
  - each: [Tome of Beasts 3, Brood & Bloom, The Waking Garden]
    as: book
    steps:
      - check: { role: checkbox, name: $book }
      - wait: 150
  - click: { role: button, name: Done }
  # The libraries just ticked are fetched on demand.
  - wait: 700
  - click: { role: button, name: Show the compendium }
  - wait: 800
  - fill: { placeholder: Search creatures… }
    value: Aboleth
  - wait: 500
  - click: { text: Aboleth }
  - wait: 900
  # Cleared so the list shows its full length — the count above it is part of what the
  # section is claiming.
  - fill: { placeholder: Search creatures… }
    value: ''
  - wait: 600

clip: viewport
