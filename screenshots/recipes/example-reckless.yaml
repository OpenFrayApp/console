# yaml-language-server: $schema=../../node_modules/shotlist/dist/recipe.schema.json
#
# The worked Reckless Attack example (fight/effects.md). No callouts — the sentence the
# builder derives from the choices above it is what the page is showing.
name: example-reckless
install: docs

setup:
  - use: seed
  - use: start
  - click: { text: Ren }
  - wait: 250
  - click: { role: button, name: Apply effect }
  - wait: 400
  - select: { label: Duration }
    optionLabel: 1 round
  - click: { role: button, name: Add a bonus or penalty }
  - wait: 200
  - select: { label: Modifier effect }
    optionLabel: Advantage
  - select: { label: Applies to }
    optionLabel: Attack rolls
  - check: { role: radio, name: Rolls made against it }
  - fill: { label: Modifier label }
    value: Reckless attack
  - wait: 200

clip: { panel: Apply effect to Ren, pad: 12 }
