# Expires the shared encounters nobody owns. A link published while signed out carries no
# owner_id, so its publisher can never take it down; the publish dialog promises those stop
# working after 60 days, and this is what keeps that promise. An owned link is never touched
# and stands until its owner unpublishes it.
#
# Safe to run with the public anon key: sweep_shares() is a security-definer function that
# only removes rows already past the deadline, so calling it early is a no-op and no
# service-role key has to live in this repository.
#
# Setup: the same two repository secrets keepalive.yml uses.
#   SUPABASE_URL       e.g. https://<project>.supabase.co
#   SUPABASE_ANON_KEY  the public anon/publishable key
#
# The alternative, if pg_cron is enabled on the project, is one line in the SQL editor and
# no workflow at all:
#   select cron.schedule('sweep-shares', '17 4 * * *', $$select sweep_shares()$$);
name: Sweep expired shares

# This workflow makes no GitHub API calls, so it needs no token permissions.
permissions: {}

on:
  schedule:
    # Daily at 04:17 UTC. A missed run costs nothing: the next one takes whatever aged out
    # in the meantime, because the deadline is a property of the row, not of the schedule.
    - cron: '17 4 * * *'
  workflow_dispatch: {} # allow manual runs from the Actions tab

jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - name: Delete ownerless shares past 60 days
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "Missing SUPABASE_URL / SUPABASE_ANON_KEY repository secrets." >&2
            exit 1
          fi
          swept=$(curl --fail --silent --show-error --retry 3 --retry-delay 5 \
            -X POST "$SUPABASE_URL/rest/v1/rpc/sweep_shares" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            -H "Content-Type: application/json" \
            -d '{}')
          echo "swept $swept expired share(s)"
