<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Apply the theme shared with the marketing site (openfray-theme) before
      // paint to avoid a flash. Dark is the default unless 'light' was chosen.
      try {
        if (localStorage.getItem('openfray-theme') !== 'light') {
          document.documentElement.classList.add('dark')
        }
      } catch (e) {
        document.documentElement.classList.add('dark')
      }
    </script>
    <!-- viewport-fit=cover lets the bottom bar pad itself past the home indicator
         (env(safe-area-inset-bottom)) on notched phones. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Leads with what the tab is, not the product: the console, the player view and the
         handbook are often open at once, and every one of them starting "OpenFray" made
         them indistinguishable once a tab is narrow. main.tsx retitles the player view. -->
    <title>Combat console — OpenFray</title>
    <meta
      name="description"
      content="A fast, browser-based combat console for Game Masters running DnD 5e."
    />
    <!-- The link preview, for the console pasted into a Discord channel or a forum thread.
         The tags are static and Cloudflare serves this one shell for every /console/* path
         (see the parent repo's scripts/assemble-site.mjs), so a player-view link unfurls
         with these too: every word here has to stay true of both screens. Absolute URLs,
         because a crawler resolves neither a root-relative nor a relative one. The image
         is the site's banner carrying the console's own URL line, and the declared size
         has to match the file: a crawler lays the card out from these numbers before the
         picture arrives. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="OpenFray" />
    <meta property="og:title" content="Combat console — OpenFray" />
    <meta
      property="og:description"
      content="A fast, browser-based combat console for Game Masters running DnD 5e."
    />
    <meta property="og:url" content="https://openfray.app/console/" />
    <meta property="og:image" content="https://openfray.app/console/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="OpenFray — a DnD 5e combat console for Game Masters" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Combat console — OpenFray" />
    <meta
      name="twitter:description"
      content="A fast, browser-based combat console for Game Masters running DnD 5e."
    />
    <meta name="twitter:image" content="https://openfray.app/console/og-image.png" />
    <link rel="icon" type="image/svg+xml" href="/console/favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/console/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- Fathom Analytics loads from main.tsx in production builds only (never on the dev
         server / localhost). -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
